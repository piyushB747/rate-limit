spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=8081


spring.data.redis.host=localhost
spring.data.redis.port=6379


#Routes For user-services #Formed URL  =  http://localhost:8081/api/users
spring.cloud.gateway.server.webflux.routes[0].id=USER-SERVICES
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICES
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/roles/**
#spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Path=/api/roles/**
#spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**,/api/roles/**

